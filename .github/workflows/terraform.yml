name: Terraform CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-plan:
    name: Format, validate and plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inspect GitHub OIDC claims
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            core.info(`sub: ${payload.sub}`);
            core.info(`aud: ${JSON.stringify(payload.aud)}`);
            core.info(`repository: ${payload.repository}`);
            core.info(`repository_id: ${payload.repository_id}`);
            core.info(`repository_owner_id: ${payload.repository_owner_id}`);

      - name: Configure AWS credentials with OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsAssessment

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Note about deployment
        run: echo "Validation complete. Configure remote state and review IAM before enabling apply."
