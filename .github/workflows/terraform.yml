
name: Terraform CI and deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-plan:
    name: Format, validate and verify AWS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 3: Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials with OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsAssessment

      # Step 4: Verify AWS identity
      - name: Verify AWS identity
        if: github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      # Step 5: Check Terraform formatting
      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

      # Step 6: Initialize without a remote backend
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false

      # Step 7: Validate Terraform configuration
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      # Step 8: Report status
      - name: Report validation status
        run: |
          echo "Terraform formatting check completed."
          echo "Terraform initialization completed."
          echo "Terraform validation completed."
          echo "AWS identity was checked on push and manual runs."
          echo "No AWS infrastructure was deployed."
